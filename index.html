<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>BeLa Alliance — Performance Tracker (demo)</title>
<style>
:root{
  --bg:#12151c; --surface:#1a1e28; --surface2:#222736; --line:#2e3444;
  --ink:#e7eaf0; --ink2:#9aa3b2; --ink3:#6b7383;
  --accent:#5b8def; --accent-soft:rgba(91,141,239,.16);
  --gold:#e5b84b; --warn:#e5b84b; --bad:#e06c75;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:14px 12px 40px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{font-size:19px;font-weight:700;letter-spacing:.2px}
h1 .tag{color:var(--accent)}
.sub{color:var(--ink2);font-size:12px;margin-bottom:12px}
.badge{display:inline-block;background:rgba(229,184,75,.15);color:var(--gold);border:1px solid rgba(229,184,75,.4);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.5px;vertical-align:2px}
.langs{display:flex;gap:6px}
.langs button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.langs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.tile .k{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.tile .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--ink2);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pills button{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.pills button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 10px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--surface2);z-index:2}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:180px;overflow:hidden;text-overflow:ellipsis}
th.name{background:var(--surface2);z-index:3}
td.rank,th.rank{text-align:center;color:var(--ink2);position:sticky;left:0;background:var(--surface);width:38px;min-width:38px;z-index:1}
th.rank{background:var(--surface2);z-index:3}
td.rank + td.name, th.rank + th.name{left:38px}
tr.dep td{color:var(--ink3)}
tr.dep td.name{color:var(--ink3)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(91,141,239,.07)}
tr:hover td.name, tr:hover td.rank{background:#212637}
.bar{position:relative}
.bar i{position:absolute;inset-inline-start:0;top:15%;height:70%;background:var(--accent-soft);border-radius:0 4px 4px 0;z-index:0}
[dir=rtl] .bar i{border-radius:4px 0 0 4px}
.bar b{position:relative;z-index:1;font-weight:600}
.top3 td.rank{color:var(--gold);font-weight:700}
.star{color:var(--gold)}
.foot{color:var(--ink2);font-size:12px;margin-top:10px;line-height:1.6}
.foot .star{margin-inline-end:2px}
.zero{color:var(--ink3)}
td.rt{font-weight:700;text-align:center}
td.rt.R1{color:#e06c75} td.rt.R2{color:#e5b84b} td.rt.R3{color:#7bc98a}
.rtile{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.rtile.R1{color:#e06c75;border-color:rgba(224,108,117,.5);background:rgba(224,108,117,.12)}
.rtile.R2{color:#e5b84b;border-color:rgba(229,184,75,.5);background:rgba(229,184,75,.12)}
.rtile.R3{color:#7bc98a;border-color:rgba(123,201,138,.5);background:rgba(123,201,138,.12)}
h2{font-size:15px;margin:16px 0 8px}
h2 .seas{color:var(--accent);font-weight:600}
.plink{cursor:pointer}
.plink:hover{color:var(--accent);text-decoration:underline}
.lseen{color:var(--ink3);font-size:11px;margin-inline-start:6px;text-transform:none;letter-spacing:0}
.search{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.search::placeholder{color:var(--ink3)}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.plist button:hover{border-color:var(--accent);color:var(--accent)}
.plist button.depp{color:var(--ink3)}
.hint{color:var(--ink2);font-size:13px;margin:8px 0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.fgrp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.fgrp>label{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-inline-end:2px}
.filters select,.filters input{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px}
.filters input{min-width:150px}
.filters input::placeholder{color:var(--ink3)}
.fbtn{background:var(--surface2);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.fbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.fbtn.on.R1{background:rgba(224,108,117,.16);border-color:#e06c75;color:#e06c75}
.fbtn.on.R2{background:rgba(229,184,75,.16);border-color:#e5b84b;color:#e5b84b}
.fbtn.on.R3{background:rgba(123,201,138,.16);border-color:#7bc98a;color:#7bc98a}
.fcount{color:var(--ink2);font-size:12px;margin-inline-start:auto}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .sarrow{color:var(--accent);font-size:10px;margin-inline-start:3px}
td.up{color:#7bc98a} td.dn{color:#e06c75}
.chartwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 6px 4px;margin-bottom:10px}
.chartwrap svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);padding:4px 8px 8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.dot.hollow{background:transparent;border:2px solid var(--warn)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-top:8px;font-size:13px;color:var(--ink2)}
.note b{color:var(--ink)}
.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--ink)}
.pname{font-size:18px;font-weight:700;margin:4px 0 2px}
.pstatus{font-size:12px;margin-bottom:10px}
.pstatus.cur{color:#7bc98a}
.pstatus.gone{color:var(--ink3)}
[dir=rtl] th,[dir=rtl] td{text-align:left}
[dir=rtl] td.name,[dir=rtl] th.name{text-align:right}

.demo{background:rgba(229,184,75,.14);border:1px solid rgba(229,184,75,.5);color:var(--gold);
  border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:12px;font-weight:600;letter-spacing:.3px}
td.rt{font-weight:700;text-align:center}
td.rt.R3{color:#7bc98a} td.rt.R2{color:var(--gold)} td.rt.R1{color:var(--bad)}
.why{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
.why h4{font-size:13px;margin-bottom:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px}
.wrow{display:grid;grid-template-columns:140px 1fr 120px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.wbar{position:relative;height:16px;background:var(--surface2);border-radius:4px;overflow:hidden}
.wbar i{position:absolute;left:0;top:0;height:100%;background:var(--accent-soft);border-right:2px solid var(--accent)}
.wrow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.wtot{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-weight:700;display:flex;justify-content:space-between}
.drop{color:var(--ink3);font-style:italic}
.expl{color:var(--ink2);font-size:12px;line-height:1.6;margin-top:10px}
.expl b{color:var(--ink)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.sarrow{color:var(--accent);font-size:10px;margin-inline-start:4px}
</style>
</head>

const W=DATA.weeks, NW=W.length, WK=DATA.weekly, SE=DATA.season, EVT=DATA.events;
const BANDS=DATA.bands, WEIGHTS=DATA.weights;
const byName={}; SE.forEach(s=>byName[s.n]=s);
let state={lang:LANGS[0], tab:'season', week:NW-1, player:null, q:'',
  sort:{season:{k:'rank',d:1}, week:{k:'rank',d:1}, ptab:{k:'week',d:-1}}};
const $=id=>document.getElementById(id), t=()=>L[state.lang];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null?'—':new Intl.NumberFormat(t().nf).format(Math.round(n));
const f1=n=>n==null?'—':new Intl.NumberFormat(t().nf,{minimumFractionDigits:1,maximumFractionDigits:1}).format(n);
const fdate=s=>new Intl.DateTimeFormat(t().nf,{day:'numeric',month:'short',year:'numeric'}).format(new Date(s+'T00:00:00'));
const fshort=s=>new Intl.DateTimeFormat(t().nf,{day:'numeric',month:'short'}).format(new Date(s+'T00:00:00'));
const bandOf=v=>v==null?null:(v>=BANDS.R3?'R3':(v>=BANDS.R2?'R2':'R1'));

const BANDORD={R1:1,R2:2,R3:3};
function cmp(a,b,dir){
  if(a==null&&b==null) return 0;
  if(a==null) return 1;              // missing sorts last in BOTH directions
  if(b==null) return -1;
  if(typeof a==='string') return dir*a.localeCompare(b,t().nf);
  return dir*(a-b);
}
function sortBy(rows,cols,st){
  const c=cols.find(x=>x.k===st.k)||cols[0];
  return rows.slice().sort((p,q)=>cmp(c.get(p),c.get(q),st.d));
}
function thead(cols,tbl){
  const st=state.sort[tbl];
  return '<tr>'+cols.map(c=>
    `<th class="${c.cls||''} sortable" onclick="setSort('${tbl}','${c.k}')">${c.label()}`
    +(st.k===c.k?`<span class="sarrow">${st.d<0?'\u25bc':'\u25b2'}</span>`:'')+'</th>').join('')+'</tr>';
}
function setSort(tbl,k){
  const st=state.sort[tbl];
  if(st.k===k) st.d=-st.d; else { st.k=k; st.d=(k==='rank'||k==='n'||k==='week')?1:-1; }
  render();
}

function render(){
  const tr=t();
  document.documentElement.lang=state.lang; document.body.dir=tr.dir;
  $('t-title').textContent=tr.title;
  $('demo').textContent=tr.demo;
  $('t-sub').textContent=tr.sub.replace('{n}',SE.length).replace('{w}',NW);
  $('langs').innerHTML=LANGS.map(k=>`<button class="${k===state.lang?'on':''}" onclick="setLang('${k}')">${L[k].lab}</button>`).join('');
  $('tabs').innerHTML=['season','week','player'].map(k=>
    `<button class="${k===state.tab?'on':''}" onclick="setTab('${k}')">${tr.tabs[k]}</button>`).join('');
  $('view').innerHTML = state.tab==='season'?seasonHTML():state.tab==='week'?weekHTML():playerHTML();
  $('foot').innerHTML=`<b>${tr.howHead}.</b> ${tr.how.replace('{vs}',WEIGHTS.vs*100).replace('{events}',WEIGHTS.events*100).replace('{kills}',WEIGHTS.kills*100)}`
    +`<br><br><b>${tr.bandHead}.</b> ${tr.bandRule.replace('{r3}',BANDS.R3).replace('{r3m}',BANDS.R3-1).replace(/\{r2\}/g,BANDS.R2)}`
    +`<br><br>${tr.pickNote}`;
  if(state._focus){const el=$('psearch'); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);} state._focus=false;}
}

function seasonHTML(){
  const tr=t(), max=Math.max(...SE.map(s=>s.avg));
  const cols=[
    {k:'rank', cls:'rank', label:()=>tr.rank,      get:s=>s.rank},
    {k:'n',    cls:'name', label:()=>tr.player,    get:s=>s.n},
    {k:'avg',             label:()=>tr.composite,  get:s=>s.avg},
    {k:'band',            label:()=>tr.band,       get:s=>BANDORD[s.band]},
    {k:'weeks',           label:()=>tr.weeks,      get:s=>s.weeks},
    {k:'vs',              label:()=>tr.vs,         get:s=>s.vsTotal},
    {k:'ev',              label:()=>tr.events,     get:s=>s.evElig?s.evAtt/s.evElig:null},
    {k:'kills',           label:()=>tr.kills,      get:s=>s.killsTotal},
  ];
  let h=`<div class="tblwrap"><table><thead>${thead(cols,'season')}</thead><tbody>`;
  sortBy(SE,cols,state.sort.season).forEach(s=>{
    h+=`<tr class="${s.rank<=3?'top3':''}"><td class="rank">${s.rank}</td>
      <td class="name"><span class="plink" data-p="${esc(s.n)}">${esc(s.n)}</span></td>
      <td class="bar"><i style="width:${Math.max(2,s.avg/max*100)}%"></i><b>${f1(s.avg)}</b></td>
      <td class="rt ${s.band}">${s.band}</td><td>${s.weeks}</td>
      <td>${fmt(s.vsTotal)}</td><td>${s.evAtt}/${s.evElig}</td><td>${fmt(s.killsTotal)}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}

function weekHTML(){
  const tr=t(), rows=Object.values(WK[String(state.week)]).sort((a,b)=>a.rank-b.rank);
  const max=Math.max(...rows.map(r=>r.composite));
  const evs=EVT.map((e,i)=>({...e,i})).filter(e=>e.week===state.week);

  const cols=[
    {k:'rank', cls:'rank', label:()=>tr.rank,      get:r=>r.rank},

    {k:'comp',            label:()=>tr.composite,  get:r=>r.composite},
    {k:'band',            label:()=>tr.band,       get:r=>BANDORD[r.band]},

    h+=`<tr class="${r.rank<=3?'top3':''}"><td class="rank">${r.rank}</td>

      <td>${r.evAtt}/${r.evElig}</td></tr>`;

function whyCard(r, wi){
  const tr=t(); const names={vs:tr.vsPct, events:tr.evPct, kills:tr.killPct};
  let h=`<div class="why"><h4>${tr.why} — ${fdate(W[wi])}</h4>`;
  ['vs','events','kills'].forEach(c=>{
    const p=r.pct[c], w=r.applied[c];
    if(p==null){ h+=`<div class="wrow"><span>${names[c]}</span><span class="drop">${tr.dropped}</span><span class="num">—</span></div>`; return; }
    h+=`<div class="wrow"><span>${names[c]}</span>
      <span class="wbar"><i style="width:${p}%"></i></span>
      <span class="num">${f1(p)} × ${Math.round(w*100)}% = ${f1(p*w)}</span></div>`;
  });
  h+=`<div class="wtot"><span>${tr.composite}</span><span>${f1(r.composite)} → <span class="rt ${r.band}">${r.band}</span></span></div>`;
  h+=`<div class="expl">${tr.events}: ${r.evAtt} ${tr.attended} ${tr.of} ${r.evElig} ${tr.eligible}</div></div>`;
  return h;
}

  const tr=t(), Wd=880,Hd=260,ml=44,mr=14,mt=14,mb=34, iw=Wd-ml-mr, ih=Hd-mt-mb;
  const X=i=>ml+(NW===1?iw/2:i/(NW-1)*iw), Y=v=>mt+ih-(v/100)*ih;
  let s=`<div class="chartwrap"><svg viewBox="0 0 ${Wd} ${Hd}" role="img">`;
  [0,25,50,75,100].forEach(v=>{
    s+=`<line x1="${ml}" x2="${Wd-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`
     +`<text x="${ml-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--ink2)">${v}</text>`;
  });
  [BANDS.R2,BANDS.R3].forEach(v=>{ s+=`<line x1="${ml}" x2="${Wd-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--gold)" stroke-dasharray="5 4" opacity=".6"/>`; });
  for(let i=0;i<NW;i++) s+=`<text x="${X(i)}" y="${Hd-10}" text-anchor="middle" font-size="10" style="fill:var(--ink2)">${fshort(W[i])}</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map(p=>X(p.i)+','+Y(p.v)).join(' ')}"/>`;
  pts.forEach(p=>{ s+=`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="4" fill="var(--accent)"><title>${fdate(W[p.i])}: ${f1(p.v)}</title></circle>`; });
  return s+`</svg></div>`;
}

function playerHTML(){
  const tr=t();
  if(!state.player){
    const q=state.q.trim().toLowerCase();
    return `<div class="hint">${tr.noPlayer}</div>
      <input id="psearch" class="search" placeholder="${esc(tr.search)}" value="${esc(state.q)}" oninput="setQ(this.value)">
      <div class="plist">`+SE.filter(s=>!q||s.n.toLowerCase().includes(q)).map(s=>
        `<button data-p="${esc(s.n)}">${esc(s.n)}</button>`).join('')+`</div>`;
  }
  const s=byName[state.player];
  const pts=[]; for(let i=0;i<NW;i++){ const r=WK[String(i)][state.player]; if(r) pts.push({i,v:r.composite}); }
  const last=pts.length?pts[pts.length-1].i:null;
  let h=`<div class="pills"><button onclick="clearPlayer()">← ${tr.tabs.player}</button></div>
    <div class="pname">${esc(s.n)}</div>
    <div class="pstatus cur">${tr.seasonRank}: ${s.rank} / ${SE.length} · <span class="rt ${s.band}">${s.band}</span>`
    +(s.join>0?` · ${tr.joined.replace('{w}',s.join+1)}`:'')+(s.leave?` · ${tr.left.replace('{w}',s.leave)}`:'')+`</div>`;
  h+=`<div class="tiles">`+[[tr.avg,f1(s.avg)],[tr.best,f1(s.best)],[tr.worst,f1(s.worst)],
      [tr.weeks,s.weeks],[tr.events,`${s.evAtt}/${s.evElig}`],[tr.kills,fmt(s.killsTotal)]]
      .map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')+`</div>`;
  h+=`<h2>${tr.trend}</h2>`;
  h+= pts.length<2 ? `<div class="note">${tr.noTrend}</div>` : trendSVG(pts);
  if(last!=null) h+=whyCard(WK[String(last)][state.player], last);
  const mine=[];
  for(let i=0;i<NW;i++){ const r=WK[String(i)][state.player]; if(r) mine.push({...r, wi:i}); }
  const cols=[
    {k:'week', cls:'name', label:()=>tr.weekOf,    get:r=>r.wi},
    {k:'comp',            label:()=>tr.composite,  get:r=>r.composite},
    {k:'band',            label:()=>tr.band,       get:r=>BANDORD[r.band]},
    {k:'vs',              label:()=>tr.vsPct,      get:r=>r.pct.vs},
    {k:'ev',              label:()=>tr.evPct,      get:r=>r.pct.events},
    {k:'kills',           label:()=>tr.killPct,    get:r=>r.pct.kills},
    {k:'evn',             label:()=>tr.events,     get:r=>r.evElig?r.evAtt/r.evElig:null},
  ];
  h+=`<div class="tblwrap"><table><thead>${thead(cols,'ptab')}</thead><tbody>`;
  sortBy(mine,cols,state.sort.ptab).forEach(r=>{
    h+=`<tr><td class="name">${fdate(W[r.wi])}</td><td><b>${f1(r.composite)}</b></td><td class="rt ${r.band}">${r.band}</td>
      <td>${r.pct.vs==null?'—':f1(r.pct.vs)}</td><td>${r.pct.events==null?'—':f1(r.pct.events)}</td>
      <td class="${r.pct.kills==null?'zero':''}">${r.pct.kills==null?'—':f1(r.pct.kills)}</td><td>${r.evAtt}/${r.evElig}</td></tr>`; });
  return h+'</tbody></table></div>';
}

function setLang(k){state.lang=k;render();}
function setTab(k){if(k==='player'&&state.tab==='player')state.player=null;state.tab=k;render();}
function setWeek(i){state.week=i;render();}
function setQ(v){state.q=v;state._focus=true;render();}
function clearPlayer(){state.player=null;render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-p]'); if(!el)return;
  state.player=el.dataset.p; state.tab='player'; render(); window.scrollTo({top:0});});
render();

</script>
</body>
</html>
